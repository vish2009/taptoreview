<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Review...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f9fafb;
      color: #111827;
    }
    .box { text-align: center; }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Opening Google Review page...</p>
  </div>

  <script>
    const supabaseUrl = 'https://zavspmqjmrinfxenbosz.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdnNwbXFqbXJpbmZ4ZW5ib3N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NTkzOTksImV4cCI6MjEwNDAzNTM5OX0.7K-EFRRgLmLOh8BltHDH0qh61TDLbLlzCjJ5jBMXCc8'; // Replace with your actual anon public key
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    async function handleRedirect() {
      // Extract slug from URL path (e.g., /cafe-bloom -> cafe-bloom)
      const slug = window.location.pathname.replace(/^\/+|\/+$/g, '');

      if (!slug) {
        window.location.replace('/');
        return;
      }

      // 1. Fetch destination URL for Google platform
      const { data, error } = await supabaseClient
        .from('clients')
        .select('destination_url')
        .eq('slug', slug)
        .eq('platform', 'google')
        .single();

      if (error || !data?.destination_url) {
        document.querySelector('.box').innerHTML = '<h2>Business link not found.</h2>';
        return;
      }

      // 2. Increment analytics asynchronously with composite keys
      supabaseClient.rpc('increment_tap', {
        client_slug: slug,
        client_platform: 'google'
      });

      // 3. Immediately redirect to Google
      window.location.replace(data.destination_url);
    }

    handleRedirect();
  </script>
</body>
</html>
