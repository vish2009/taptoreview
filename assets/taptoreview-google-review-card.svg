<svg xmlns="http://www.w3.org/2000/svg" width="85.6mm" height="54mm" viewBox="0 0 856 540" role="img" aria-labelledby="title description" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">TapToReview Google Review Card</title>
  <desc id="description">CR80 85.6 by 54 millimetre print template for an NFC Google review card.</desc>
  <rect width="856" height="540" fill="#101925"/>
  <rect x="30" y="30" width="796" height="480" rx="18" fill="none" stroke="#d4af37" stroke-opacity=".55" stroke-width="2"/>

  <g transform="translate(535 48)">
    <g fill="none" stroke="#d4af37" stroke-linecap="round" stroke-width="5">
      <path d="M108 17c6-4 13-4 19 0"/>
      <path d="M103 11c9-7 20-7 29 0"/>
      <path d="M98 5c12-10 27-10 39 0"/>
    </g>
    <text x="0" y="56" font-family="Arial, sans-serif" font-size="32" font-weight="700"><tspan fill="#ffffff">TapTo</tspan><tspan fill="#d4af37">Review</tspan><tspan fill="#0284c7">.in</tspan></text>
  </g>

  <text x="56" y="183" fill="#ffffff" font-family="Arial, sans-serif" font-size="50" font-weight="700">THANK YOU FOR VISITING</text>
  <text x="56" y="241" fill="#d4af37" font-family="Arial, sans-serif" font-size="44" font-weight="700">LEAVE US A REVIEW</text>
  <text x="56" y="286" fill="#a8b4c8" font-family="Arial, sans-serif" font-size="25">Takes 10 seconds. No app needed.</text>

  <g transform="translate(56 336)">
    <circle cx="38" cy="38" r="37" fill="#0284c7" fill-opacity=".18" stroke="#0284c7" stroke-width="2"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="4">
      <path d="M27 25v26c0 4 3 7 7 7h8c4 0 7-3 7-7V25c0-4-3-7-7-7h-8c-4 0-7 3-7 7z"/>
      <path d="M34 24h8M34 52h8"/>
    </g>
    <text x="91" y="34" fill="#ffffff" font-family="Arial, sans-serif" font-size="27" font-weight="700">TAP HERE</text>
    <text x="91" y="65" fill="#a8b4c8" font-family="Arial, sans-serif" font-size="21">Hold your phone to this card</text>
  </g>

